<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 30 20">
  <!-- Uzbekistan: blue / white thin / green, crescent + 12 stars -->
  <rect width="30" height="20" fill="#1eb53a"/>
  <rect width="30" height="8" fill="#1ebbd7"/>
  <rect y="7.5" width="30" height="1.1" fill="#fff"/>
  <rect y="11.4" width="30" height="1.1" fill="#fff"/>
