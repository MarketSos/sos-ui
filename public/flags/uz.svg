    <circle cx="10.3" cy="1.8" r="0.42"/>
    <circle cx="11.6" cy="1.8" r="0.42"/>
    <circle cx="12.9" cy="1.8" r="0.42"/>
    <circle cx="14.2" cy="1.8" r="0.42"/>
    <circle cx="15.5" cy="1.8" r="0.42"/>
    <circle cx="9"  cy="3.5" r="0.42"/>
    <circle cx="10.3" cy="3.5" r="0.42"/>
    <circle cx="11.6" cy="3.5" r="0.42"/>
    <circle cx="12.9" cy="3.5" r="0.42"/>
    <circle cx="14.2" cy="3.5" r="0.42"/>
    <circle cx="15.5" cy="3.5" r="0.42"/>
  </g>
</svg>
