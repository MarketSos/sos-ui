<div class="auth-wrapper">
  <p-card styleClass="auth-card">
    <ng-template pTemplate="header">
      <div class="auth-header">
        <h2>SOS</h2>
        <p>Store Operation System</p>
      </div>
    </ng-template>

    <form [formGroup]="form" (ngSubmit)="onSubmit()" class="auth-form">
      @if (error$ | async; as error) {
        <p-message severity="error" [text]="error" styleClass="w-full mb-3" />
      }

      <div class="field">
        <label for="userName">Login</label>
        <input
          pInputText
          id="userName"
          formControlName="userName"
          placeholder="foydalanuvchi_nomi"
          class="w-full"
          autocomplete="username"
        />
        @if (form.get('userName')?.invalid && form.get('userName')?.touched) {
          <small class="error-text">Kamida 3 ta belgi</small>
        }
      </div>

      <div class="field">
        <label for="password">Parol</label>
        <p-password
          inputId="password"
          formControlName="password"
          placeholder="••••••••"
          [feedback]="false"
          [toggleMask]="true"
          styleClass="w-full"
          inputStyleClass="w-full"
          autocomplete="current-password"
        />
        @if (form.get('password')?.invalid && form.get('password')?.touched) {
          <small class="error-text">Kamida 6 ta belgi</small>
        }
      </div>

      <p-button
        type="submit"
        label="Kirish"
        icon="pi pi-sign-in"
        styleClass="w-full"
        [loading]="(loading$ | async) ?? false"
        [disabled]="form.invalid"
      />

      <p class="auth-link">
        Hisobingiz yo'qmi? <a routerLink="/auth/register">Ro'yxatdan o'ting</a>
      </p>
    </form>
  </p-card>
</div>
