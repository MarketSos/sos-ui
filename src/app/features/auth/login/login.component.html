<div class="login-container">
  <mat-card class="login-card">
    <mat-card-header>
      <mat-card-title>SOS - Store Operation System</mat-card-title>
      <mat-card-subtitle>Tizimga kiring</mat-card-subtitle>
    </mat-card-header>

    <mat-card-content>
      <form [formGroup]="form" (ngSubmit)="onSubmit()">

        <div *ngIf="error$ | async as error" class="error-banner">
          {{ error }}
        </div>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Email</mat-label>
          <input matInput formControlName="email" type="email" autocomplete="email" />
          <mat-icon matSuffix>email</mat-icon>
          <mat-error *ngIf="form.get('email')?.hasError('required')">
            Email majburiy
          </mat-error>
          <mat-error *ngIf="form.get('email')?.hasError('email')">
            Email formati noto'g'ri
          </mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Parol</mat-label>
          <input
            matInput
            formControlName="password"
            [type]="hidePassword ? 'password' : 'text'"
            autocomplete="current-password"
          />
          <button
            mat-icon-button
            matSuffix
            type="button"
            (click)="hidePassword = !hidePassword"
          >
            <mat-icon>{{ hidePassword ? 'visibility_off' : 'visibility' }}</mat-icon>
          </button>
          <mat-error *ngIf="form.get('password')?.hasError('required')">
            Parol majburiy
          </mat-error>
          <mat-error *ngIf="form.get('password')?.hasError('minlength')">
            Kamida 6 ta belgi
          </mat-error>
        </mat-form-field>

        <button
          mat-raised-button
          color="primary"
          type="submit"
          class="full-width login-btn"
          [disabled]="form.invalid || (loading$ | async)"
        >
          <ng-container *ngIf="loading$ | async; else loginLabel">
            <mat-spinner diameter="20"></mat-spinner>
          </ng-container>
          <ng-template #loginLabel>Kirish</ng-template>
        </button>

        <p class="register-link">
          Hisobingiz yo'qmi? <a routerLink="/auth/register">Ro'yxatdan o'ting</a>
        </p>

      </form>
    </mat-card-content>
  </mat-card>
</div>
