<p-toast />

<div class="page">
  <div class="page-header">
    <div>
      <h1>Kategoriyalar</h1>
      <p>Mahsulot kategoriyalari ro'yxati.</p>
    </div>
  </div>

  <p-table [value]="categories()" [loading]="loading()" styleClass="p-datatable-sm">
    <ng-template pTemplate="header">
      <tr>
        <th>Nom UZ</th>
        <th>Nom RU</th>
        <th>Parent ID</th>
      </tr>
    </ng-template>
    <ng-template pTemplate="body" let-item>
      <tr>
        <td>{{ item.nameUz }}</td>
        <td>{{ item.nameRu }}</td>
        <td>{{ item.parentId ?? '—' }}</td>
      </tr>
    </ng-template>
    <ng-template pTemplate="emptymessage">
      <tr><td colspan="3" class="empty-msg">Kategoriya topilmadi</td></tr>
    </ng-template>
  </p-table>
</div>
