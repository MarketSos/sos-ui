<p-toast />

<div class="page">
  <div class="page-header">
    <div>
      <h1>{{ 'page_categories_title' | translate }}</h1>
      <p>{{ 'page_categories_desc' | translate }}</p>
    </div>
  </div>

  <p-table [value]="categories()" [loading]="loading()" styleClass="p-datatable-sm">
    <ng-template pTemplate="header">
      <tr>
        <th>{{ 'lbl_name' | translate }}</th>
        <th>{{ 'lbl_parent' | translate }}</th>
      </tr>
    </ng-template>
    <ng-template pTemplate="body" let-item>
      <tr>
        <td>{{ item | entityName }}</td>
        <td>{{ item.parentId ?? '—' }}</td>
      </tr>
    </ng-template>
    <ng-template pTemplate="emptymessage">
      <tr><td colspan="2" class="empty-msg">{{ 'page_categories_empty' | translate }}</td></tr>
    </ng-template>
  </p-table>
</div>
