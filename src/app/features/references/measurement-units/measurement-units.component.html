<p-toast />

<div class="page">
  <div class="page-header">
    <div>
      <h1>O'lchov birliklari</h1>
      <p>Mahsulotlar uchun o'lchov birliklarini boshqarish.</p>
    </div>
    <button pButton type="button" label="O'lchov birligi qo'shish" icon="pi pi-plus" (click)="openCreate()"></button>
  </div>

  <p-table [value]="measurementUnits()" [loading]="loading()" styleClass="p-datatable-sm">
    <ng-template pTemplate="header">
      <tr>
        <th>Kod</th>
        <th>Nom UZ</th>
        <th>Nom RU</th>
        <th>Og'irlik</th>
      </tr>
    </ng-template>
    <ng-template pTemplate="body" let-item>
      <tr>
        <td><code>{{ item.code }}</code></td>
        <td>{{ item.nameUz }}</td>
        <td>{{ item.nameRu }}</td>
        <td>{{ item.isWeightBased ? 'Ha' : 'Yo‘q' }}</td>
      </tr>
    </ng-template>
    <ng-template pTemplate="emptymessage">
      <tr><td colspan="4" class="empty-msg">O'lchov birliklari topilmadi</td></tr>
    </ng-template>
  </p-table>
</div>

<p-dialog header="O'lchov birligi" [visible]="dialogVisible()" (visibleChange)="dialogVisible.set($event)" [modal]="true" [draggable]="false" [style]="{ width: '520px' }">
  <form [formGroup]="form" class="dialog-form">
    <label>Kod</label>
    <input pInputText formControlName="code" placeholder="KG" />

    <label>Nom UZ</label>
    <input pInputText formControlName="nameUz" placeholder="Kilogramm" />

    <label>Nom RU</label>
    <input pInputText formControlName="nameRu" placeholder="Килограмм" />

    <label>Nom EN</label>
    <input pInputText formControlName="nameEn" placeholder="Kilogram" />

    <div class="checkbox-row">
      <input type="checkbox" id="isWeightBased" formControlName="isWeightBased" />
      <label for="isWeightBased">Og'irlik asosida</label>
    </div>
  </form>
  <ng-template pTemplate="footer">
    <button pButton type="button" label="Bekor qilish" [text]="true" severity="secondary" (click)="dialogVisible.set(false)"></button>
    <button pButton type="button" label="Saqlash" [disabled]="form.invalid || saving()" (click)="save()"></button>
  </ng-template>
</p-dialog>
