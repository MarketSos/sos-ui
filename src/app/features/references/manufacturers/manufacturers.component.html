<p-toast />

<div class="page">
  <div class="page-header">
    <div>
      <h1>{{ 'page_manufacturers_title' | translate }}</h1>
      <p>{{ 'page_manufacturers_desc' | translate }}</p>
    </div>
    <button pButton type="button" [label]="'page_manufacturers_add' | translate" icon="pi pi-plus" (click)="openCreate()"></button>
  </div>

  <p-table [value]="manufacturers()" [loading]="loading()" styleClass="p-datatable-sm">
    <ng-template pTemplate="header">
      <tr>
        <th>{{ 'lbl_name' | translate }}</th>
        <th style="width:170px">{{ 'lbl_actions' | translate }}</th>
      </tr>
    </ng-template>
    <ng-template pTemplate="body" let-item>
      <tr>
        <td>{{ item | entityName }}</td>
        <td class="table-actions">
          <button pButton type="button" icon="pi pi-pencil" [text]="true" severity="secondary" (click)="openEdit(item)"></button>
          <button pButton type="button" icon="pi pi-trash" [text]="true" severity="danger" (click)="delete(item)"></button>
        </td>
      </tr>
    </ng-template>
    <ng-template pTemplate="emptymessage">
      <tr><td colspan="2" class="empty-msg">{{ 'page_manufacturers_empty' | translate }}</td></tr>
    </ng-template>
  </p-table>
</div>

<p-dialog [header]="'dlg_manufacturer' | translate" [visible]="dialogVisible()" (visibleChange)="dialogVisible.set($event)" [modal]="true" [draggable]="false" [style]="{ width: '520px' }">
  <form [formGroup]="form" class="dialog-form">
    <label>{{ 'lbl_name_uz' | translate }}</label>
    <input pInputText formControlName="nameUz" placeholder="Ishlab chiqaruvchi nomi" />

    <label>{{ 'lbl_name_ru' | translate }}</label>
    <input pInputText formControlName="nameRu" placeholder="Название производителя" />

    <label>{{ 'lbl_name_en' | translate }}</label>
    <input pInputText formControlName="nameEn" placeholder="Manufacturer name" />

    <label>{{ 'lbl_name_uz_cyrl' | translate }}</label>
    <input pInputText formControlName="nameUzCyrl" placeholder="Ишлаб чиқарувчи номи" />
  </form>
  <ng-template pTemplate="footer">
    <button pButton type="button" [label]="'btn_cancel' | translate" [text]="true" severity="secondary" (click)="dialogVisible.set(false)"></button>
    <button pButton type="button" [label]="'btn_save' | translate" [disabled]="form.invalid || saving()" (click)="save()"></button>
  </ng-template>
</p-dialog>
