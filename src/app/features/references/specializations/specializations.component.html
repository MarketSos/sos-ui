<p-toast />

<div class="page">
  <div class="page-header">
    <div>
      <h1>Mutaxassisliklar</h1>
      <p>Xodimlar uchun mutaxassislik turlarini boshqarish.</p>
    </div>
    <button pButton type="button" label="Mutaxassislik qo'shish" icon="pi pi-plus" (click)="openCreate()"></button>
  </div>

  <p-table [value]="specializations()" [loading]="loading()" styleClass="p-datatable-sm">
    <ng-template pTemplate="header">
      <tr>
        <th>Kod</th>
        <th>Nom UZ</th>
        <th>Nom RU</th>
        <th style="width:170px">Amallar</th>
      </tr>
    </ng-template>
    <ng-template pTemplate="body" let-item>
      <tr>
        <td><code>{{ item.code }}</code></td>
        <td>{{ item.nameUz }}</td>
        <td>{{ item.nameRu }}</td>
        <td class="table-actions">
          <button pButton type="button" icon="pi pi-pencil" [text]="true" severity="secondary" (click)="openEdit(item)"></button>
          <button pButton type="button" icon="pi pi-trash" [text]="true" severity="danger" (click)="delete(item)"></button>
        </td>
      </tr>
    </ng-template>
    <ng-template pTemplate="emptymessage">
      <tr><td colspan="4" class="empty-msg">Mutaxassislik topilmadi</td></tr>
    </ng-template>
  </p-table>
</div>

<p-dialog header="Mutaxassislik" [visible]="dialogVisible()" (visibleChange)="dialogVisible.set($event)" [modal]="true" [draggable]="false" [style]="{ width: '520px' }">
  <form [formGroup]="form" class="dialog-form">
    <label>Kod</label>
    <input pInputText formControlName="code" placeholder="CASHIER" [readonly]="editMode()" />

    <label>Nom UZ</label>
    <input pInputText formControlName="nameUz" placeholder="Kassir" />

    <label>Nom RU</label>
    <input pInputText formControlName="nameRu" placeholder="Кассир" />

    <label>Nom EN</label>
    <input pInputText formControlName="nameEn" placeholder="Cashier" />

    <label>Nom UZ Kiril</label>
    <input pInputText formControlName="nameUzKiril" placeholder="Кассир" />
  </form>
  <ng-template pTemplate="footer">
    <button pButton type="button" label="Bekor qilish" [text]="true" severity="secondary" (click)="dialogVisible.set(false)"></button>
    <button pButton type="button" label="Saqlash" [disabled]="form.invalid || saving()" (click)="save()"></button>
  </ng-template>
</p-dialog>
